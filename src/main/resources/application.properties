spring.application.name=Planned-AI-Task-Manager
server.port=8080

# Datasource (Flyway uses it too)
spring.datasource.url=${TASK_MANAGER_DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway
spring.flyway.locations=classpath:db/migration/postgres

# JPA: Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Spring AI: Google GenAI (Gemini Developer API)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL}

# Actuator
management.endpoints.web.exposure.include=health

# App
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=60m
app.ai.timeout=20s
app.ai.quota-per-hour=30
app.cors.allowed-origins=http://localhost:5173
