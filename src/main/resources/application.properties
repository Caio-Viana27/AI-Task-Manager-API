spring.application.name=Planned-AI-Task-Manager
server.port=8080

# Datasource (Flyway uses it too)
spring.datasource.url=${TASK_MANAGER_DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway
spring.flyway.locations=classpath:db/migration/postgres

# JPA: Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Instant maps to the TIMESTAMP (no time zone) columns, always stored as UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Spring AI: vendor-neutral env vars (wave 3 plan, D10). AI_PROVIDER picks the chat
# provider; each built-in provider maps AI_MODEL and its connection settings below.
spring.ai.model.chat=${AI_PROVIDER:google-genai}
# Google GenAI (Gemini Developer API)
spring.ai.google.genai.api-key=${AI_API_KEY}
spring.ai.google.genai.chat.model=${AI_MODEL}
# Spring AI's own retry is off: AiClient retries once within one deadline (wave 3, D2).
# The property is a retry count (RetryPolicy.maxRetries), so 0 means a single attempt.
spring.ai.retry.max-attempts=0

# Actuator
management.endpoints.web.exposure.include=health

# App
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=60m
app.ai.timeout=20s
app.ai.quota-per-hour=30
app.cors.allowed-origins=http://localhost:5173
# Subtask tree depth limit; a top-level task is depth 1 (PLAN §0)
app.tasks.max-depth=5
